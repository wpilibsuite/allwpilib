name: Upstream utils

on:
  merge_group:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: "Update"
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-2vcpu-ubuntu-2404', 'ubuntu-24.04') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch all history and metadata
        run: |
          git checkout -b pr
          git branch -f main origin/main
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configure committer identity
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
      - name: Run llvm.py
        id: llvm
        run: |
          cd upstream_utils
          ./llvm.py clone --shallow
          ./llvm.py copy-src
          ./llvm.py format-patch
        background: true # LLVM takes the longest amount of time, so let's run this in parallel with everything else.
      - name: Run ada.py
        run: |
          cd upstream_utils
          ./ada.py clone --shallow
          ./ada.py copy-src
          ./ada.py format-patch
      - name: Run apriltag.py
        run: |
          cd upstream_utils
          ./apriltag.py clone --shallow
          ./apriltag.py copy-src
          ./apriltag.py format-patch
      - name: Run argparse_lib.py
        run: |
          cd upstream_utils
          ./argparse_lib.py clone --shallow
          ./argparse_lib.py copy-src
          ./argparse_lib.py format-patch
      - name: Run benchmark.py
        run: |
          cd upstream_utils
          ./benchmark.py clone --shallow
          ./benchmark.py copy-src
          ./benchmark.py format-patch
      - name: Run double-conversion.py
        run: |
          cd upstream_utils
          ./double-conversion.py clone --shallow
          ./double-conversion.py copy-src
          ./double-conversion.py format-patch
      - name: Run eigen.py
        run: |
          cd upstream_utils
          ./eigen.py clone --shallow
          ./eigen.py copy-src
          ./eigen.py format-patch
      - name: Run gcem.py
        run: |
          cd upstream_utils
          ./gcem.py clone --shallow
          ./gcem.py copy-src
          ./gcem.py format-patch
      - name: Run htrie.py
        run: |
          cd upstream_utils
          ./htrie.py clone --shallow
          ./htrie.py copy-src
          ./htrie.py format-patch
      - name: Run imgui.py
        run: |
          cd upstream_utils
          ./imgui.py clone --shallow
          ./imgui.py copy-src
          ./imgui.py format-patch
      - name: Run imnodeflow.py
        run: |
          cd upstream_utils
          ./imnodeflow.py clone
          ./imnodeflow.py copy-src
          ./imnodeflow.py format-patch
      - name: Run implot.py
        run: |
          cd upstream_utils
          ./implot.py clone --shallow
          ./implot.py copy-src
          ./implot.py format-patch
      - name: Run json.py
        run: |
          cd upstream_utils
          ./json.py clone --shallow
          ./json.py copy-src
          ./json.py format-patch
      - name: Run libdogleg.py
        run: |
          cd upstream_utils
          ./libdogleg.py clone --shallow
          ./libdogleg.py copy-src
          ./libdogleg.py format-patch
      - name: Run libuv.py
        run: |
          cd upstream_utils
          ./libuv.py clone --shallow
          ./libuv.py copy-src
          ./libuv.py format-patch
      - name: Run llhttp.py
        run: |
          cd upstream_utils
          ./llhttp.py clone --shallow
          ./llhttp.py copy-src
          ./llhttp.py format-patch
      - name: Run mpack.py
        run: |
          cd upstream_utils
          ./mpack.py clone --shallow
          ./mpack.py copy-src
          ./mpack.py format-patch
      - name: Run mrcal.py
        run: |
          cd upstream_utils
          ./mrcal.py clone --shallow
          ./mrcal.py copy-src
          ./mrcal.py format-patch
      - name: Run mrcal_java.py
        run: |
          cd upstream_utils
          ./mrcal_java.py clone --shallow
          ./mrcal_java.py copy-src
          ./mrcal_java.py format-patch
      - name: Run pocketfft.py
        run: |
          cd upstream_utils
          ./pocketfft.py clone
          ./pocketfft.py copy-src
          ./pocketfft.py format-patch
      - name: Run sleipnir.py
        run: |
          cd upstream_utils
          ./sleipnir.py clone --shallow
          ./sleipnir.py copy-src
          ./sleipnir.py format-patch
      - name: Run stb.py
        run: |
          cd upstream_utils
          ./stb.py clone --shallow
          ./stb.py copy-src
          ./stb.py format-patch
      - name: Run upb.py
        run: |
          cd upstream_utils
          ./upb.py clone --shallow
          ./upb.py copy-src
          ./upb.py format-patch
      - name: Wait for LLVM
        wait: llvm
      - name: Add untracked files to index so they count as changes
        run: git add -A
      - name: Check output
        run: |
          set +e
          git --no-pager diff --exit-code HEAD ':!*.bazel'
          git_exit_code=$?
          if test "$git_exit_code" -ne "0"; then
            echo "::error ::upstream_utils check failed. This is usually caused by a bad script or the copied files differing from what the script outputs. You can learn more about using upstream_utils to modify thirdparty libraries at https://github.com/wpilibsuite/allwpilib/blob/main/upstream_utils/README.md"
            exit $git_exit_code
          fi
