name: Compatibility report

on:
  workflow_call:
    inputs:
      baseline:
        description: Baseline commit SHA, or previous-tag for a branch comparison
        required: true
        type: string
      candidate:
        description: Candidate commit SHA (the proposed merge for a PR)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  revisions:
    runs-on: ubuntu-24.04
    continue-on-error: true
    outputs:
      baseline: ${{ steps.baseline.outputs.ref }}
      label: ${{ steps.baseline.outputs.label }}
      matrix: ${{ steps.plan.outputs.matrix }}
      fallback: ${{ steps.plan.outputs.fallback }}
      fallback-count: ${{ steps.plan.outputs.fallback-count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select baseline
        id: baseline
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [ "$BASELINE" = previous-tag ]; then
            if ! BASELINE=$(python3 .github/scripts/compatibility.py previous-tag --repo . --head "$CANDIDATE"); then
              echo '**INCOMPLETE: no previous release tag was found.**' >> "$GITHUB_STEP_SUMMARY"
              echo '::warning::Compatibility analysis has no baseline.'
              exit 1
            fi
          fi
          BASE_SHA=$(git rev-parse --verify "${BASELINE}^{commit}")
          echo "ref=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "label=$BASELINE ($BASE_SHA)" >> "$GITHUB_OUTPUT"
      - name: Locate existing baseline builds
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.baseline.outputs.ref }}
        run: |
          python3 .github/scripts/compatibility_artifacts.py plan --repo . \
            --revision "$BASE_SHA" --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"

  baseline:
    needs: revisions
    if: needs.revisions.outputs.baseline != '' && needs.revisions.outputs.fallback-count != '' && needs.revisions.outputs.fallback-count != '0'
    name: Fallback baseline ${{ matrix.platform }}
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.revisions.outputs.fallback) }}
    runs-on: ${{ case(matrix.os == 'ubuntu-24.04', 'blacksmith-4vcpu-ubuntu-2404', matrix.os == 'macos-15', 'blacksmith-6vcpu-macos-15', matrix.os) }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.3'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - uses: actions/cache@v5
        id: cache
        with:
          path: baseline-snapshots
          key: compatibility-baseline-v1-${{ matrix.platform }}-${{ needs.revisions.outputs.baseline }}-${{ hashFiles('candidate/.github/scripts/compatibility.py', 'candidate/.github/scripts/compatibility_binary.py', 'candidate/.github/scripts/compatibility.init.gradle', 'candidate/.github/scripts/compatibility-baseline.sh') }}
      - uses: actions/checkout@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          ref: ${{ needs.revisions.outputs.baseline }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Linux'
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v6
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Linux'
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          validate-wrappers: false
          cache-read-only: true
      - name: Build Linux baseline configurations
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        uses: wpilibsuite/docker-run-action@v4
        with:
          image: ${{ matrix.container }}
          options: -v ${{ github.workspace }}:/work -w /work/baseline
          # The action replaces newlines with semicolons; keep this as one command.
          run: >-
            bash ../candidate/.github/scripts/compatibility-baseline.sh
            /work/candidate /work/baseline-snapshots ${{ matrix.platform }}
      - name: Build desktop baseline configurations
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Linux'
        working-directory: baseline
        run: |
          bash ../candidate/.github/scripts/compatibility-baseline.sh \
            "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/baseline-snapshots" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-baseline-${{ matrix.platform }}
          path: baseline-snapshots
          retention-days: 3
          if-no-files-found: warn

  compare:
    needs: [revisions, baseline]
    if: always() && needs.revisions.outputs.matrix != ''
    name: Report ${{ matrix.platform }} (advisory)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: wpilib/systemcore-cross-debian:trixie
    continue-on-error: true
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.revisions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Download candidate build artifacts
        id: candidate-artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: ${{ matrix.pattern }}
          path: products/candidate
      - name: Download baseline build artifacts
        id: baseline-artifacts
        if: matrix.baseline_run != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.baseline_run }}
          pattern: ${{ matrix.pattern }}
          path: products/baseline
      - name: Download fallback baseline
        id: baseline-snapshots
        if: matrix.baseline_run == ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: compatibility-baseline-${{ matrix.platform }}
          path: baseline-snapshots
      - name: Discard failed downloads
        # A digest failure can leave extracted files; they must not enter the report.
        env:
          CANDIDATE: ${{ steps.candidate-artifacts.outcome }}
          BASELINE: ${{ steps.baseline-artifacts.outcome }}
          SNAPSHOTS: ${{ steps.baseline-snapshots.outcome }}
        run: |
          if [ "$CANDIDATE" = failure ]; then rm -rf products/candidate; fi
          if [ "$BASELINE" = failure ]; then rm -rf products/baseline; fi
          if [ "$SNAPSHOTS" = failure ]; then rm -rf baseline-snapshots; fi
      - name: Install comparison tools
        run: |
          sudo apt-get update
          sudo apt-get install -y abigail-tools llvm-19 clang-19 lld-19 lldb-19 python3-lldb-19 liblldb-19-dev
          echo "PYTHONPATH=$(lldb-19 -P)" >> "$GITHUB_ENV"
          mkdir -p tools report
          curl --fail --location --retry 3 --max-time 120 \
            -o tools/japicmp.jar \
            https://repo.maven.apache.org/maven2/com/github/siom79/japicmp/japicmp/0.24.2/japicmp-0.24.2-jar-with-dependencies.jar
          echo '799a3a85b3025d84b2ed9e0c105064e12adc2c414afe8c25a95454f8d3772f7f  tools/japicmp.jar' | sha256sum --check
          {
            abidiff --version
            llvm-readobj-19 --version
            lldb-19 --version
            java -version
            echo 'japicmp 0.24.2'
          } > report/tools.txt 2>&1
      - name: Test comparison engine
        env:
          JAPICMP_JAR: ${{ github.workspace }}/tools/japicmp.jar
        run: python3 -m unittest discover -s candidate/.github/scripts/compatibility_tests -v
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: wpilibsuite/vendor-json-repo
          path: vendor-json-repo
          persist-credentials: false
      - name: Compare all configurations and architectures
        if: always()
        env:
          BASE_SHA: ${{ needs.revisions.outputs.baseline }}
          BASE_LABEL: ${{ needs.revisions.outputs.label || inputs.baseline }}
          HEAD_SHA: ${{ inputs.candidate }}
          BASELINE_RUN: ${{ matrix.baseline_run }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          ARGS=()
          if [ -z "$BASELINE_RUN" ]; then
            ARGS+=(--baseline-snapshots baseline-snapshots)
          fi
          python3 candidate/.github/scripts/compatibility_artifacts.py report \
            --candidate-products products/candidate --baseline-products products/baseline \
            --base-revision "$BASE_SHA" --base-label "$BASE_LABEL" --head-revision "$HEAD_SHA" \
            --platform "$PLATFORM" --repo candidate --inventory vendor-json-repo \
            --japicmp tools/japicmp.jar --output report "${ARGS[@]}"
      - name: Publish summary
        if: always()
        run: |
          mkdir -p report
          if [ ! -f report/summary.md ]; then
            echo '# Compatibility report (advisory)' > report/summary.md
            echo '**INCOMPLETE: setup or analysis failed. See the job logs.**' >> report/summary.md
          fi
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q INCOMPLETE report/summary.md; then
            echo '::warning::Compatibility analysis is incomplete; see the summary and job logs.'
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-${{ matrix.platform }}-${{ inputs.candidate }}
          path: |
            report/**/*.md
            report/**/*.json
            report/**/*.txt
            report/**/*.xml
            report/**/*.html
          if-no-files-found: warn
