extra_includes:
- format

classes:
  wpi::math::TrapezoidProfile:
    force_type_casters:
    - wpi::units::second_t
    - wpi::units::radians_per_second
    - wpi::units::radians_per_second_squared
    template_params:
    - Distance
    doc_code_blocks:
    - |
      constraints = TrapezoidProfile.Constraints(MAX_V, MAX_A)
      previous_profiled_reference = TrapezoidProfile.State(initial_reference, 0.0)
      profile = TrapezoidProfile(constraints)
    - |
      previous_profiled_reference = profile.calculate(
          time_since_previous_update, previous_profiled_reference, unprofiled_reference
      )
    methods:
      TrapezoidProfile:
        param_override:
          constraints:
            x_type: typename TrapezoidProfile<Distance>::Constraints
          goal:
            x_type: typename TrapezoidProfile<Distance>::State
          initial:
            x_type: typename TrapezoidProfile<Distance>::State
      Calculate:
      TimeLeftUntil:
      Duration:
      IsFinished:
    template_inline_code: |
      {
      std::string clsNameCopy = clsName;

      cls_TrapezoidProfile.attr("Constraints") = py::type::of<Constraints>();

      cls_State
        .def(
          py::init<Distance_t, Velocity_t>(),
          py::arg("position") = 0,
          py::arg("velocity") = 0
        )
        .def("__repr__", [clsNameCopy](const State &self) {
          return std::format("{}.State(position={}, velocity={})",
            clsNameCopy,
            self.position(),
            self.velocity());
        });
      }
  wpi::math::detail::TrapezoidProfileConstraints:
    template_params:
    - Distance
    attributes:
      maxVelocity:
      maxAcceleration:
    methods:
      TrapezoidProfileConstraints:
        overloads:
          '':
          Velocity_t, Acceleration_t:
            param_override:
              maxVelocity:
                default: '0'
              maxAcceleration:
                default: '0'
    template_inline_code: |
      std::string clsNameCopy = clsName;

      cls_TrapezoidProfileConstraints
        .def("__repr__", [clsNameCopy](const wpi::math::detail::TrapezoidProfileConstraints<Distance>& self) {
          return std::format("{}(max_velocity={}, max_acceleration={})",
            clsNameCopy,
            self.maxVelocity(),
            self.maxAcceleration());
        });
  wpi::math::TrapezoidProfile::State:
    force_no_default_constructor: true
    attributes:
      position:
      velocity:
    methods:
      operator==:
        cpp_code: py::self == State()
  wpi::math::TrapezoidProfile::ProfileTiming:
    attributes:
      t_1:
      t_2:
      t_3:
    methods:
      operator==:

templates:
  TrapezoidProfileConstraints:
    qualname: wpi::math::detail::TrapezoidProfileConstraints
    params:
    - wpi::units::dimensionless::scalar

  TrapezoidProfileRadiansConstraints:
    qualname: wpi::math::detail::TrapezoidProfileConstraints
    params:
    - wpi::units::radian

  TrapezoidProfile:
    qualname: wpi::math::TrapezoidProfile
    params:
    - wpi::units::dimensionless::scalar

  # needed for HolonomicDriveController
  TrapezoidProfileRadians:
    qualname: wpi::math::TrapezoidProfile
    params:
    - wpi::units::radian
