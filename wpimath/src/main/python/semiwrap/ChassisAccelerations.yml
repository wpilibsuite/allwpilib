extra_includes:
- wpystruct.h

functions:
  to_json:
    ignore: true
  from_json:
    ignore: true
classes:
  wpi::math::ChassisAccelerations:
    force_no_default_constructor: true
    force_type_casters:
    - wpi::units::meters_per_second_squared_
    - wpi::units::radians_per_second_squared<>
    attributes:
      ax:
      ay:
      alpha:
    methods:
      ToRobotRelative:
      ToFieldRelative:
      operator+:
      operator-:
        overloads:
          const ChassisAccelerations& [const]:
          '[const]':
      operator*:
      operator/:
      operator==:

inline_code: |
  cls_ChassisAccelerations
    .def(
      py::init<
        wpi::units::meters_per_second_squared<>, wpi::units::meters_per_second_squared<>,
        wpi::units::radians_per_second_squared<>
      >(),
      py::arg("ax") = 0, py::arg("ay") = 0, py::arg("alpha") = 0
    )
    .def_static("from_fps", [](wpi::units::feet_per_second_squared<> ax, wpi::units::feet_per_second_squared<> ay, wpi::units::radians_per_second_squared<> alpha){
      return ChassisAccelerations{ax, ay, alpha};
    }, py::arg("ax") = 0, py::arg("ay") = 0, py::arg("alpha") = 0)
    .def_property("ax_fpss",
      [](ChassisAccelerations * self) -> wpi::units::feet_per_second_squared<> {
        return self->ax;
      },
      [](ChassisAccelerations * self, wpi::units::feet_per_second_squared<> ax) {
        self->ax = ax;
      }
    )
    .def_property("ay_fpss",
      [](ChassisAccelerations * self) -> wpi::units::feet_per_second_squared<> {
        return self->ay;
      },
      [](ChassisAccelerations * self, wpi::units::feet_per_second_squared<> ay) {
        self->ay = ay;
      }
    )
    .def_property("alpha_dpss",
      [](ChassisAccelerations * self) -> wpi::units::degrees_per_second_squared<> {
        return self->alpha;
      },
      [](ChassisAccelerations * self, wpi::units::degrees_per_second_squared<> alpha) {
        self->alpha = alpha;
      }
    )
    .def("__repr__", [](const ChassisAccelerations &ca) -> std::string {
      return "ChassisAccelerations(ax=" + std::to_string(ca.ax.value()) + ", "
                                  "ay=" + std::to_string(ca.ay.value()) + ", "
                                  "alpha=" + std::to_string(ca.alpha.value()) + ")";
    })
  ;

  SetupWPyStruct<wpi::math::ChassisAccelerations>(cls_ChassisAccelerations);
