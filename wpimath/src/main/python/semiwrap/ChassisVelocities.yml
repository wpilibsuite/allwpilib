extra_includes:
- wpystruct.h

functions:
  to_json:
    ignore: true
  from_json:
    ignore: true
classes:
  wpi::math::ChassisVelocities:
    force_no_default_constructor: true
    attributes:
      vx:
      vy:
      omega:
    methods:
      ToTwist2d:
      Discretize:
        overloads:
          wpi::units::meters_per_second<>, wpi::units::meters_per_second<>, wpi::units::radians_per_second<>, wpi::units::seconds<>:
          const ChassisVelocities&, wpi::units::seconds<>:
      operator+:
      operator-:
        overloads:
          const ChassisVelocities& [const]:
          '[const]':
      operator*:
      operator/:
      operator==:
      ToRobotRelative:
      ToFieldRelative:

inline_code: |
  cls_ChassisVelocities
    .def(
      py::init<
        wpi::units::meters_per_second<>, wpi::units::meters_per_second<>,
        wpi::units::radians_per_second<>
      >(),
      py::arg("vx") = 0, py::arg("vy") = 0, py::arg("omega") = 0
    )
    .def_static("from_feet", [](wpi::units::feet_per_second<> vx, wpi::units::feet_per_second<> vy, wpi::units::radians_per_second<> omega){
      return ChassisVelocities{vx, vy, omega};
    }, py::arg("vx") = 0, py::arg("vy") = 0, py::arg("omega") = 0)
    .def_property("vx_fps",
      [](ChassisVelocities * self) -> wpi::units::feet_per_second<> {
        return self->vx;
      },
      [](ChassisVelocities * self, wpi::units::feet_per_second<> vx) {
        self->vx = vx;
      }
    )
    .def_property("vy_fps",
      [](ChassisVelocities * self) -> wpi::units::feet_per_second<> {
        return self->vy;
      },
      [](ChassisVelocities * self, wpi::units::feet_per_second<> vy) {
        self->vy = vy;
      }
    )
    .def_property("omega_dps",
      [](ChassisVelocities * self) -> wpi::units::degrees_per_second<> {
        return self->omega;
      },
      [](ChassisVelocities * self, wpi::units::degrees_per_second<> omega) {
        self->omega = omega;
      }
    )
    .def("__len__", [](const ChassisVelocities &self) { return 3; })
    .def("__getitem__", [](const ChassisVelocities &self, int index) {
      switch (index) {
        case 0:
          return self.vx.value();
        case 1:
          return self.vy.value();
        case 2:
          return self.omega.value();
        default:
          throw std::out_of_range("ChassisVelocities index out of range");
      }
    })
    .def("__repr__", [](const ChassisVelocities &cs) -> std::string {
      return "ChassisVelocities(vx=" + std::to_string(cs.vx.value()) + ", "
                           "vy=" + std::to_string(cs.vy.value()) + ", "
                           "omega=" + std::to_string(cs.omega.value()) + ")";
    })
  ;

  SetupWPyStruct<wpi::math::ChassisVelocities>(cls_ChassisVelocities);
