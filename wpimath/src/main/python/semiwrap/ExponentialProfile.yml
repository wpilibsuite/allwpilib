classes:
  wpi::math::ExponentialProfile:
    force_no_trampoline: true
    doc_code_blocks:
    - |
      constraints = ExponentialProfile.Constraints.from_characteristics(MAX_V, kV, kA)
      previous_profiled_reference = ExponentialProfile.State(initial_reference, 0.0)
    - |
      sample = ExponentialProfile.generate(
          constraints, previous_profiled_reference, unprofiled_reference
      ).sample_at(time_since_previous_update)
      previous_profiled_reference = ExponentialProfile.State(
          sample.position, sample.velocity
      )
    force_type_casters:
    - wpi::units::meters_per_second_t
    template_params:
    - Distance
    - Input
    methods:
      Interpolate:
      Generate:
  wpi::math::ExponentialProfile::Constraints:
    attributes:
      maxInput:
      A:
      B:
    methods:
      Constraints:
        overloads:
          Input_t, A_t, B_t:
            ignore: true
          Input_t, kV_t, kA_t:
            ignore: true
      MaxVelocity:
    inline_code: |
      .def_static("from_state_space", [](Input_t maxInput, A_t a, B_t b) {
          return typename wpi::math::ExponentialProfile<Distance, Input>::Constraints(maxInput, a, b);
        }, py::arg("max_input"), py::arg("a"), py::arg("b"))
      .def_static("from_characteristics", [](Input_t maxInput, kV_t kv, kA_t ka) {
          return typename wpi::math::ExponentialProfile<Distance, Input>::Constraints(maxInput, kv, ka);
        }, py::arg("max_input"), py::arg("k_v"), py::arg("k_a"))

  wpi::math::ExponentialProfile::State:
    force_no_default_constructor: true
    attributes:
      position:
      velocity:
    methods:
      operator==:
    inline_code: |
      .def(py::init<Distance_t, Velocity_t>())

templates:
  ExponentialProfile:
    qualname: wpi::math::ExponentialProfile
    params:
    - wpi::units::meter
    - wpi::units::volt
