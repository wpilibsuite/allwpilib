extra_includes:
- wpi/driverstation/internal/DriverStationBackend.hpp
- wpi/event/BooleanEvent.hpp

classes:
  wpi::NiDsXboxController:
    force_no_trampoline: true
    methods:
      NiDsXboxController:
        overloads:
          int:
          GenericHID&:
      GetHID:
        overloads:
          "":
            return_value_policy: reference_internal
          '[const]':
            ignore: true
      GetLeftX:
      GetRightX:
      GetLeftY:
      GetRightY:
      GetLeftTriggerAxis:
      GetRightTriggerAxis:
      LeftBumper:
      RightBumper:
      GetLeftStickButton:
      GetRightStickButton:
      GetLeftStickButtonPressed:
      GetRightStickButtonPressed:
      GetLeftStickButtonReleased:
      GetRightStickButtonReleased:
      LeftStick:
      RightStick:
      GetAButton:
      GetAButtonPressed:
      GetAButtonReleased:
      A:
      GetBButton:
      GetBButtonPressed:
      GetBButtonReleased:
      B:
      GetXButton:
      GetXButtonPressed:
      GetXButtonReleased:
      X:
      GetYButton:
      GetYButtonPressed:
      GetYButtonReleased:
      Y:
      GetBackButton:
      GetBackButtonPressed:
      GetBackButtonReleased:
      Back:
      GetStartButton:
      GetStartButtonPressed:
      GetStartButtonReleased:
      Start:
      LeftTrigger:
        overloads:
          double, EventLoop* [const]:
          EventLoop* [const]:
      RightTrigger:
        overloads:
          double, EventLoop* [const]:
          EventLoop* [const]:
      GetLeftBumperButton:
      GetLeftBumperButtonPressed:
      GetLeftBumperButtonReleased:
      GetRightBumperButton:
      GetRightBumperButtonPressed:
      GetRightBumperButtonReleased:
      IsConnected:
      GetGamepadType:
      GetSupportedOutputs:
      GetName:
      GetPort:
      SetRumble:
      GetTelemetryType:
      LogTo:
  wpi::NiDsXboxController::Button:
    attributes:
      LEFT_BUMPER:
      RIGHT_BUMPER:
      LEFT_STICK:
      RIGHT_STICK:
      A:
      B:
      X:
      Y:
      BACK:
      START:
  wpi::NiDsXboxController::Axis:
    attributes:
      LEFT_X:
      RIGHT_X:
      LEFT_Y:
      RIGHT_Y:
      LEFT_TRIGGER:
      RIGHT_TRIGGER:
