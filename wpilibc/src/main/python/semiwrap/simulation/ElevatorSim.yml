classes:
  wpi::sim::ElevatorSim:
    typealias:
    - wpi::math::DCMotor
    - template <int S, int I, int O> using LinearSystem = wpi::math::LinearSystem<S, I, O>
    - template <int I> using Vectord = wpi::math::Vectord<I>
    methods:
      ElevatorSim:
        overloads:
          ? const wpi::math::LinearSystem<2, 1, 2>&, const wpi::math::DCMotor&, double, wpi::units::volt_t, wpi::units::meter_t, wpi::units::meter_t, wpi::units::meter_t, const std::array<double, 2>&
          : param_override:
              measurementStdDevs:
                default: std::array<double, 2>{0.0, 0.0}
      SetState:
      SetPosition:
      SetVelocity:
      WouldHitLowerLimit:
      WouldHitUpperLimit:
      HasHitLowerLimit:
      HasHitUpperLimit:
      GetGearbox:
      GetGearing:
      GetDrumRadius:
      GetCarriageMass:
      GetKg:
      GetPosition:
      GetVelocity:
      GetAcceleration:
      GetForce:
      GetCurrentDraw:
      GetInputVoltage:
      SetInputVoltage:
      UpdateX:

inline_code: |-
  cls_ElevatorSim
    .def("get_position_feet", [](ElevatorSim * self) -> wpi::units::foot_t {
      return self->GetPosition();
    })
    .def("get_position_inches", [](ElevatorSim * self) -> wpi::units::inch_t {
      return self->GetPosition();
    })
    .def("get_velocity_fps", [](ElevatorSim * self) -> wpi::units::feet_per_second_t {
      return self->GetVelocity();
    })
  ;
