classes:
  wpi::IterativeRobotBase:
    methods:
      DriverStationConnected:
      DisabledStart:
      AutonomousStart:
      TeleopStart:
      UtilityStart:
      RobotPeriodic:
      DisabledPeriodic:
      AutonomousPeriodic:
      TeleopPeriodic:
      UtilityPeriodic:
      IterativeRobotBase:
        overloads:
          double:
            ignore: true
          wpi::units::second_t:
      LoopFunc:
      SimulationStart:
      SimulationPeriodic:
      DisabledEnd:
      AutonomousEnd:
      TeleopEnd:
      UtilityEnd:
      GetPeriod:
      PrintWatchdogEpochs:
    doc: |
      IterativeRobotBase implements a specific type of robot program framework,
      extending the RobotBase class.

      The IterativeRobotBase class does not implement StartCompetition(), so it
      should not be used by teams directly.

      This class provides the following functions which are called by the main
      loop, StartCompetition(), at the appropriate times:

      DriverStationConnected() -- provide for initialization the first time the DS
      is connected

      Start() functions -- each of the following functions is called once when the
      appropriate mode starts:

      - DisabledStart() -- called each and every time disabled mode starts
      - AutonomousStart() -- called each and every time autonomous mode starts
      - TeleopStart() -- called each and every time teleoperated mode starts
      - UtilityStart() -- called each and every time utility mode starts

      Periodic() functions -- each of these functions is called on an interval:

      - RobotPeriodic()
      - DisabledPeriodic()
      - AutonomousPeriodic()
      - TeleopPeriodic()
      - UtilityPeriodic()

      End() functions -- each of the following functions is called once when the
      appropriate mode ends:

      - DisabledEnd() -- called each and every time disabled mode ends
      - AutonomousEnd() -- called each and every time autonomous mode ends
      - TeleopEnd() -- called each and every time teleoperated mode ends
      - UtilityEnd() -- called each and every time utility mode ends
