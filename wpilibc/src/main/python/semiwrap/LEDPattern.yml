extra_includes:
- rpy/AddressableLEDBuffer.h

classes:
  wpi::LEDPattern:
    enums:
      GradientType:
    methods:
      "Off":
      LEDPattern:
      ApplyTo:
        overloads:
          std::span<wpi::AddressableLED::LEDData> [const]:
            cpp_code: |
              [](const wpi::LEDPattern& self, wpi::AddressableLEDBuffer::View data) {
                return self.ApplyTo(data);
              }
          LEDReader, std::function<void (int, wpi::util::Color)> [const]:
          std::span<wpi::AddressableLED::LEDData>, std::function<void (int, wpi::util::Color)> [const]:
            cpp_code: |
              [](const wpi::LEDPattern& self, wpi::AddressableLEDBuffer::View data, std::function<void(int, wpi::util::Color)> writer) {
                return self.ApplyTo(data, writer);
              }
      Reversed:
      OffsetBy:
      ScrollAtRelativeVelocity:
      ScrollAtAbsoluteVelocity:
        doc_code_blocks:
        - |
          from wpilib import LEDPattern

          # 60 LEDs per meter, as specified by the LED strip's spec sheet.
          led_spacing = 1.0 / 60.0  # meters between adjacent LEDs
          rainbow = LEDPattern.rainbow(255, 128)
          scrolling_rainbow = rainbow.scroll_at_absolute_velocity(
              4 * 0.0254, led_spacing  # 4 inches per second, in meters per second
          )
      Blink:
        overloads:
          wpi::units::second_t, wpi::units::second_t:
          wpi::units::second_t:
      SynchronizedBlink:
      Breathe:
      OverlayOn:
      Blend:
      Mask:
      AtBrightness:
        doc_code_blocks:
        - |
          from wpilib import LEDPattern
          from wpiutil import Color

          # Solid red, but at 50% brightness.
          dim_red = LEDPattern.solid(Color.RED).at_brightness(0.5)

          # Solid white, but at only 10% brightness.
          dim_white = LEDPattern.solid(Color.WHITE).at_brightness(0.1)
      Solid:
      ProgressMaskLayer:
        doc_code_blocks:
        - |
          from wpilib import LEDPattern
          from wpiutil import Color

          base_pattern = LEDPattern.gradient(
              LEDPattern.GradientType.DISCONTINUOUS, [Color.RED, Color.BLUE]
          )
          # elevator supplies the current and maximum heights in the same units.
          progress_pattern = base_pattern.mask(
              LEDPattern.progress_mask_layer(
                  lambda: elevator.get_height() / elevator.max_height()
              )
          )
      Steps:
        overloads:
          std::span<const std::pair<double, wpi::util::Color>>:
          std::initializer_list<std::pair<double, wpi::util::Color>>:
            ignore: true
      Gradient:
        overloads:
          GradientType, std::span<const wpi::util::Color>:
          GradientType, std::initializer_list<wpi::util::Color>:
            ignore: true
      Rainbow:
      MapIndex:
    inline_code: |
      .def("apply_to", [](const wpi::LEDPattern& self, wpi::AddressableLEDBuffer& data) {
        self.ApplyTo(static_cast<std::span<wpi::AddressableLED::LEDData>>(data));
      }, py::arg("data"), release_gil())
      .def("apply_to", [](const wpi::LEDPattern& self, wpi::AddressableLEDBuffer& data,
                         std::function<void (int, wpi::util::Color)> writer) {
        self.ApplyTo(static_cast<std::span<wpi::AddressableLED::LEDData>>(data), std::move(writer));
      }, py::arg("data"), py::arg("writer").none(false), release_gil())
  wpi::LEDPattern::LEDReader:
    methods:
      LEDReader:
      size:
