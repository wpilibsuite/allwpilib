classes:
  wpi::EventLoop:
    force_type_casters:
    - std::function
    methods:
      EventLoop:
      Bind:
        cpp_code: |
          [](EventLoop *self, std::function<void()> action) {
            self->Bind(std::move(action));
          }
      Unbind:
        ignore: true # Handling references from Python still needs to be figured out
      Poll:
      Clear:
