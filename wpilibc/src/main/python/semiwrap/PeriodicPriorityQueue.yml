extra_includes:
- pybind11/chrono.h

classes:
  wpi::internal::PeriodicPriorityQueue:
    methods:
      Add:
        overloads:
          std::function<void ()>, std::chrono::nanoseconds, std::chrono::nanoseconds:
          std::function<void ()>, std::chrono::nanoseconds, std::chrono::nanoseconds, std::chrono::nanoseconds:
          std::function<void ()>, std::chrono::nanoseconds, wpi::units::seconds<>:
          std::function<void ()>, std::chrono::nanoseconds, wpi::units::seconds<>, wpi::units::seconds<>:
          Callback:
      Remove:
      Clear:
      RunCallbacks:
      GetQueue:
        ignore: true
      GetLoopStartTime:
  wpi::internal::PeriodicPriorityQueue::Callback:
    attributes:
      func:
      period:
      expirationTime:
      id:
    methods:
      Callback:
        overloads:
          std::function<void ()>, std::chrono::nanoseconds, std::chrono::nanoseconds, std::chrono::nanoseconds:
          std::function<void ()>, std::chrono::nanoseconds, wpi::units::seconds<>, wpi::units::seconds<>:
          std::function<void ()>, std::chrono::nanoseconds, wpi::units::seconds<>:
      operator>:
      operator==:
