repositories {
    maven {
        mavenLocal()
        maven {
            url = 'https://frcmaven.wpi.edu/artifactory/ex-gradle'
        }
        mavenCentral()
        url = "https://plugins.gradle.org/m2/"
    }
}

dependencies {
    // Versions live in gradle/libs.versions.toml, but the coordinates stay here: Bazel imports
    // that catalog with maven.from_toml and would try to resolve these Gradle-only plugins.
    implementation "org.wpilib:native-utils:${libs.versions.nativeUtils.get()}"
    implementation "org.wpilib:gradle-cpp-vscode:${libs.versions.gradleCppVscode.get()}"
}
