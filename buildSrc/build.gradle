repositories {
    maven {
        mavenLocal()
        maven {
            url = 'https://frcmaven.wpi.edu/artifactory/ex-gradle'
        }
        mavenCentral()
        url = "https://plugins.gradle.org/m2/"
    }
}

dependencies {
    // Plugin coordinates are specified here instead of the version catalog so
    // Bazel doesn't pick them up when using maven.from_toml
    implementation "org.wpilib:native-utils:${libs.versions.nativeUtils.get()}"
    implementation "org.wpilib:gradle-cpp-vscode:${libs.versions.gradleCppVscode.get()}"
}
