[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
    "hatch-nativelib==0.0.0",
    "hatch-robotpy==0.0.0",
    "robotpy-native-wpiutil==0.0.0",
]

[project]
name = "robotpy-native-tunables"
version = "0.0.0"
description = "WPILib Tunables Library"
license = "BSD-3-Clause"

dependencies = [
    "robotpy-native-wpiutil==0.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/native"]

[[tool.hatch.build.hooks.robotpy.maven_lib_download]]
artifact_id = "tunables-cpp"
group_id = "org.wpilib.tunables"
repo_url = ""
version = "0.0.0"

extract_to = "src/native/tunables"
libs = ["tunables"]

[[tool.hatch.build.hooks.nativelib.pcfile]]
pcfile = "src/native/tunables/robotpy-native-tunables.pc"
name = "tunables"

includedir = "src/native/tunables/include"
libdir = "src/native/tunables/lib"
shared_libraries = ["tunables"]
requires = ["robotpy-native-wpiutil"]
