classes:
  wpi::tunables::TunableBackend:
    force_no_default_constructor: true
    force_no_trampoline: true
    doc_append: |
      Backends must be implemented in native code. Python method overrides are
      not called by the registry. Publish tunables through tunables.publish()
      or TunableTable, not directly through a backend.
    methods:
      Publish:
        ignore: true
      MarkDirty:
      Remove:
      RemovePrefix:
      UnregisterTunable:
      Update:
      Retire:
  wpi::tunables::TunableBackend::PublishedTunable:
    attributes:
      path:
      uid:
