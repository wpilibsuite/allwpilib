[build-system]
build-backend = "hatchling.build"
requires = [
    "semiwrap==0.0.0",
    "hatch-meson==0.0.0",
    "hatch-robotpy==0.0.0",
    "hatchling",
    "robotpy-native-telemetry==0.0.0",
    "robotpy-wpiutil==0.0.0",
]

[project]
name = "robotpy-telemetry"
version = "0.0.0"
description = "Binary wrapper for WPILib telemetry library"
requires-python = ">=3.11"
authors = [
    {name = "RobotPy Development Team", email = "robotpy@googlegroups.com"},
]
license = "BSD-3-Clause"
dependencies = [
    "robotpy-native-telemetry==0.0.0",
    "robotpy-wpiutil==0.0.0",
]

[project.urls]
"Source code" = "https://github.com/robotpy/mostrobotpy"

[tool.hatch.build.hooks.robotpy]
version_file = "telemetry/version.py"

[tool.hatch.build.hooks.semiwrap]

[tool.hatch.build.hooks.meson]

[tool.hatch.build.targets.wheel]
packages = ["telemetry"]

[tool.semiwrap]
update_init = [
    "telemetry"
]
scan_headers_ignore = [
    "wpi/telemetry/Telemetry.hpp",
    "wpi/telemetry/detail/PathUtil.hpp",

    # rpy
    "rpy/MockTelemetryBackendFunctions.h",
    "rpy/MockTelemetryBackendValueCasters.h",
]

[tool.semiwrap.name_transform]
default = "snake_case"
enum_value = "CAPS_CASE"
known_words = ["3V3", "5V", "CAN", "CPU", "DS", "FMS", "FPGA", "HAL", "HTTP", "I2C", "IMU", "JNI", "JSON", "mDNS", "NT", "OpMode", "PCM", "PDH", "PDP", "PID", "POVs", "PWM", "RIO", "SPI", "URI", "URL", "USB", "VIn"]

[tool.semiwrap.extension_modules."telemetry._telemetry"]
name = "telemetry"
wraps = ["robotpy-native-telemetry"]
depends = ["wpiutil"]
includes = ["telemetry/src"]

[tool.semiwrap.extension_modules."telemetry._telemetry".headers]
TelemetryEntry = "wpi/telemetry/TelemetryEntry.hpp"
TelemetryBackend = "wpi/telemetry/TelemetryBackend.hpp"
DiscardTelemetryBackend = "wpi/telemetry/DiscardTelemetryBackend.hpp"
MultiTelemetryBackend = "wpi/telemetry/MultiTelemetryBackend.hpp"
MockTelemetryBackend = "wpi/telemetry/MockTelemetryBackend.hpp"
TelemetryRegistry = "wpi/telemetry/TelemetryRegistry.hpp"
TelemetryLoggable = "wpi/telemetry/TelemetryLoggable.hpp"
TelemetryTable = "wpi/telemetry/TelemetryTable.hpp"
PyTelemetryTable = "rpy/PyTelemetryTable.h"
TelemetryFunctions = "rpy/TelemetryFunctions.h"
