syntax = "proto3";

package wpi.proto;

import "wpi/math/protobuf/geometry3d.proto";

option java_package = "org.wpilib.fields.proto.detail";

option java_outer_classname = "ProtobufFieldsDescriptor";

option java_multiple_files = true;

message ProtobufFieldId {
  uint32 id = 1;
}

message ProtobufFieldTag {
  uint32 id = 1;
  ProtobufPose3d pose = 2;
}

message ProtobufFieldImage {
  string path = 1;
  uint32 top = 2;
  uint32 left = 3;
  uint32 bottom = 4;
  uint32 right = 5;
}

message ProtobufField {
  message ProtobufFieldDimensions {
    double length = 1;
    double width = 2;
  }

  string name = 1;
  string season = 2;
  string game = 3;
  ProtobufFieldDimensions field_dimensions = 4;
  string program = 5;
  optional ProtobufFieldImage image = 6;
  repeated ProtobufFieldTag tags = 7;
}
