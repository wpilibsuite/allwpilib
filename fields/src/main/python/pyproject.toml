[build-system]
build-backend = "hatchling.build"
requires = [
    "semiwrap~=0.6.0",
    "hatch-meson~=0.1.2",
    "hatch-robotpy~=0.2.1",
    "hatchling",
    "robotpy-native-fields==0.0.0",
    "robotpy-wpiutil==0.0.0",
    "robotpy-wpimath==0.0.0",
]

[project]
name = "robotpy-fields"
version = "0.0.0"
description = "RobotPy bindings for WPILib's fields library"
requires-python = ">=3.11"
authors = [
    {name = "RobotPy Development Team", email = "robotpy@googlegroups.com"},
]
license = "BSD-3-Clause"
dependencies = [
    "robotpy-native-fields==0.0.0",
    "robotpy-wpiutil==0.0.0",
    "robotpy-wpimath==0.0.0",
]

[project.urls]
"Source code" = "https://github.com/robotpy/mostrobotpy"


[tool.hatch.build.hooks.robotpy]
version_file = "robotpy_fields/version.py"

[tool.hatch.build.hooks.semiwrap]

[tool.hatch.build.hooks.meson]

[tool.hatch.build.targets.wheel]
packages = ["robotpy_fields"]


[tool.semiwrap]
update_init = [
  "robotpy_fields robotpy_fields._fields"
]
scan_headers_ignore = [
  "wpi/fields/field_images.hpp",
  "wpi/fields/frc/*",
  "wpi/fields/ftc/*",
]

[tool.semiwrap.name_transform]
default = "snake_case"
enum_value = "CAPS_CASE"
known_words = ["3V3", "5V", "CAN", "CPU", "DS", "FMS", "FPGA", "HAL", "HTTP", "I2C", "IMU", "JNI", "JSON", "mDNS", "NT", "OpMode", "PCM", "PDH", "PDP", "PID", "POVs", "PWM", "RIO", "SPI", "URI", "URL", "USB", "VIn"]

[tool.semiwrap.extension_modules."robotpy_fields._fields"]
name = "fields"
wraps = ["robotpy-native-fields"]
depends = ["wpiutil", "wpimath"]

[tool.semiwrap.extension_modules."robotpy_fields._fields".headers]
# wpi/fields
Field = "wpi/fields/Field.hpp"
FieldImage = "wpi/fields/FieldImage.hpp"
FieldTag = "wpi/fields/FieldTag.hpp"
fields = "wpi/fields/fields.hpp"
